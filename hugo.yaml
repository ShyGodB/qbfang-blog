    renderer:
      unsafe: false
  highlight:
    noClasses: false

params:
  description: 方奇兵的个人博客，记录 AI Agent、产品、阅读与生活。
  intro: 写 AI Agent、产品、阅读，以及生活中值得留下来的判断。
  author: 方奇兵

menus:
  main:
    - name: 文章
      pageRef: /posts
      weight: 10
    - name: 关于
      pageRef: /about
      weight: 20
