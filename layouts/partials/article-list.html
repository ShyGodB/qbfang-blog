<ol class="article-list">
  {{ range . }}
    <li>
      <a href="{{ .RelPermalink }}">
        <span class="article-title">{{ .LinkTitle }}</span>
        <span class="article-meta">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
          <span aria-hidden="true">·</span>
          <span>{{ .ReadingTime }} 分钟</span>
        </span>
      </a>
    </li>
  {{ end }}
</ol>
