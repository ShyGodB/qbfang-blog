<header class="site-header">
  <div class="shell header-inner">
    <a class="site-name" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <nav aria-label="主导航">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent .Menu . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <button class="theme-toggle" type="button" aria-label="切换到夜间模式" title="切换到夜间模式" data-theme-toggle>
        <svg class="theme-icon theme-icon-sun" width="20" height="20" aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3.5"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
        </svg>
        <svg class="theme-icon theme-icon-moon" width="20" height="20" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M20.25 15.38A8.5 8.5 0 0 1 8.62 3.75a8.5 8.5 0 1 0 11.63 11.63Z"></path>
        </svg>
      </button>
    </nav>
  </div>
</header>
