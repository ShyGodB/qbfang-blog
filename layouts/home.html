{{ define "main" }}
  <div class="shell home">
    <section class="intro" aria-labelledby="intro-title">
      <h1 id="intro-title">{{ site.Title }}</h1>
      <p>{{ site.Params.intro }}</p>
    </section>

    <section class="writing" aria-labelledby="latest-title">
      <div class="section-heading">
        <h2 id="latest-title">最近文章</h2>
        <a href="{{ relref . "/posts" }}">全部文章</a>
      </div>

      {{ $posts := where site.RegularPages "Section" "posts" }}
      {{ if $posts }}
        {{ partial "article-list.html" ($posts.ByDate.Reverse | first 8) }}
      {{ else }}
        <p class="empty-state">文章正在路上。</p>
      {{ end }}
    </section>
  </div>
{{ end }}
